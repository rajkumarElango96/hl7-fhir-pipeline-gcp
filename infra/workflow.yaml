# Orchestrator: one execution per landed file, started by an Eventarc trigger.
# It passes only the file path to each job (control), never the data: each job reads
# its input from the previous layer in BigQuery or Cloud Storage.
main:
  params: [event]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - file: ${event.data.name}

    - ignoreOtherFiles:
        switch:
          - condition: ${not(text.match_regex(file, "\\.hl7$"))}
            return: ${"ignored " + file}

    - parse:
        call: runJob
        args: { job: "parser", file: "${file}", project: "${project}", region: "${region}" }

    - validate:
        call: runJob
        args: { job: "validator", file: "${file}", project: "${project}", region: "${region}" }

    - transform:
        call: runJob
        args: { job: "transformer", file: "${file}", project: "${project}", region: "${region}" }

    - done:
        return: ${"processed " + file}

# Runs one Cloud Run job with INPUT_FILE set, and waits for it to finish.
# A failed execution (after the job's own retries) stops the workflow here, so later
# steps never run on incomplete data. Re-running the workflow is safe: every job is idempotent.
runJob:
  params: [job, file, project, region]
  steps:
    - run:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project + "/locations/" + region + "/jobs/" + job}
          body:
            overrides:
              containerOverrides:
                - env:
                    - name: INPUT_FILE
                      value: ${file}
    - log:
        call: sys.log
        args:
          json:
            job: ${job}
            file: ${file}
            status: succeeded
